name: Build MPC-HC x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout MPC-HC 2.5.2
        uses: actions/checkout@v4
        with:
          repository: clsid2/mpc-hc
          ref: 'refs/tags/2.5.2'
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup MSYS2 and MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          location: C:\
          update: true
          install: >-
            make
            diffutils
            pkg-config
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-yasm
            mingw-w64-x86_64-pkgconf

      - name: Configure environment
        shell: pwsh
        run: |
          "MPCHC_MSYS=C:\msys64" >> $env:GITHUB_ENV
          "MPCHC_MINGW64=C:\msys64\mingw64" >> $env:GITHUB_ENV
          "MPCHC_MINGW32=C:\msys64\mingw64" >> $env:GITHUB_ENV
          "MSYSTEM=MINGW64" >> $env:GITHUB_ENV
          "MSYS2_PATH_TYPE=inherit" >> $env:GITHUB_ENV
          "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
          "C:\msys64\usr\bin" >> $env:GITHUB_PATH

          @"
          @ECHO OFF
          SET "MPCHC_MSYS=C:\msys64"
          SET "MPCHC_MINGW64=C:\msys64\mingw64"
          SET "MPCHC_MINGW32=C:\msys64\mingw64"
          SET "MSYSTEM=MINGW64"
          SET "MSYS2_PATH_TYPE=inherit"
          SET "MPCHC_GIT=C:\Program Files\Git"
          SET "MPCHC_WINSDK_VER=10.0"
          "@ | Set-Content build.user.bat -Encoding ASCII

      - name: Check build environment
        shell: cmd
        run: |
          msbuild -version
          git log -1 --oneline
          where gcc || exit /b 1
          where nasm || exit /b 1
          where yasm || exit /b 1
          where make || exit /b 1
          where x86_64-w64-mingw32-nm || exit /b 1
          gcc --version
          nasm -v
          yasm --version
          echo %MPCHC_MINGW64%

      - name: Update version
        shell: cmd
        run: call update_version.bat

      - name: Build MPC-HC x64
        shell: cmd
        run: |
          msbuild mpc-hc.sln /m /t:Build /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0

      - name: Upload MPC-HC
        uses: actions/upload-artifact@v4
        with:
          name: MPC-HC-2.5.2-x64
          path: bin/mpc-hc_x64/
          if-no-files-found: error
          retention-days: 30
