name: Build MPC-HC 2.5.2 x64
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source: original or smart-shuffle (must be based on 2.5.2)'
        type: choice
        options: [original, smart-shuffle]
        default: original
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout MPC-HC 2.5.2
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source == 'smart-shuffle' && github.repository || 'clsid2/mpc-hc' }}
          ref: ${{ inputs.source == 'smart-shuffle' && 'smart-shuffle' || 'refs/tags/2.5.2' }}
          submodules: recursive
          fetch-depth: 0
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Remove existing MSYS2
        shell: pwsh
        run: |
          if (Test-Path 'C:\msys64') { Remove-Item 'C:\msys64' -Recurse -Force }
      - name: Setup MSYS2 and MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          location: C:\
          update: true
          install: >-
            make diffutils pkg-config
            mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
            mingw-w64-x86_64-nasm mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-bzip2 mingw-w64-x86_64-zlib mingw-w64-x86_64-xz
      - name: Install YASM
        shell: pwsh
        run: choco install yasm -y
      - name: Configure build environment
        shell: pwsh
        run: |
          'MPCHC_MSYS=C:\msys64' >> $env:GITHUB_ENV
          'MPCHC_MINGW64=C:\msys64\mingw64' >> $env:GITHUB_ENV
          'MSYSTEM=MINGW64' >> $env:GITHUB_ENV
          'MSYS2_PATH_TYPE=inherit' >> $env:GITHUB_ENV
          'C:\msys64\usr\bin' >> $env:GITHUB_PATH
          'C:\msys64\mingw64\bin' >> $env:GITHUB_PATH
          @'
          @ECHO OFF
          SET "MPCHC_MSYS=C:\msys64"
          SET "MPCHC_MINGW64=C:\msys64\mingw64"
          SET "MSYSTEM=MINGW64"
          SET "MSYS2_PATH_TYPE=inherit"
          SET "MPCHC_GIT=C:\Program Files\Git"
          SET "MPCHC_WINSDK_VER=10.0"
          '@ | Set-Content build.user.bat -Encoding ASCII
          $bin = 'C:\msys64\mingw64\bin'
          foreach ($tool in @('nm','ar','ranlib','strip','objdump','dlltool')) {
            $src = Join-Path $bin "$tool.exe"
            $dst = Join-Path $bin "x86_64-w64-mingw32-$tool.exe"
            if ((Test-Path $src) -and !(Test-Path $dst)) { Copy-Item $src $dst }
          }
      - name: Check build environment
        shell: pwsh
        run: |
          msbuild -version
          git log -1 --oneline
          foreach ($tool in @('gcc','nasm','yasm','make','x86_64-w64-mingw32-nm')) {
            Get-Command "$tool.exe" -ErrorAction Stop | Select-Object Source
          }
          if (!(Test-Path 'C:\msys64\mingw64\lib\libbz2.a')) { throw 'Missing bzip2' }
      - name: Fix MinGW library paths for x64
        shell: pwsh
        run: |
          $root = 'C:\msys64\mingw64'
          $runtime = Join-Path $root 'lib\libmingwex.a'
          $gccLib = (& "$root\bin\gcc.exe" -print-libgcc-file-name | Select-Object -Last 1).Trim()
          if (!(Test-Path $gccLib -PathType Leaf)) {
            $libs = @(Get-ChildItem "$root\lib\gcc\x86_64-w64-mingw32" -Filter libgcc.a -Recurse -File)
            if ($libs.Count -ne 1) { throw 'Cannot uniquely identify x64 libgcc.a' }
            $gccLib = $libs[0].FullName
          }
          if (!(Test-Path $runtime -PathType Leaf)) { throw 'Missing x64 libmingwex.a' }
          $gccLib = (Resolve-Path -LiteralPath $gccLib).Path
          $runtime = (Resolve-Path -LiteralPath $runtime).Path
          
          New-Item -ItemType Directory -Force -Path "lib64" | Out-Null
          
          Write-Host "GCC library: $gccLib"
          Write-Host "MinGW runtime: $runtime"
          
          if (!(Test-Path $gccLib -PathType Leaf)) {
              throw "Missing libgcc.a"
          }
          $script = Get-Content update_mingwlib.bat
          $fixed = foreach ($line in $script) {
            if ($line -match 'i686-w64-mingw32|lib32_libmingwex|MOVE /Y %LIBDIR%\\libmingwex') { continue }
            if ($line -match '^\s*COPY.*x86_64-w64-mingw32.*libgcc\.a') {
              'COPY /V /Y "' + $gccLib + '" %LIBDIR%64\'
              'IF ERRORLEVEL 1 EXIT /B 1'
            } elseif ($line -match '^\s*COPY.*x86_64-w64-mingw32.*libmingwex\.a') {
              'COPY /V /Y "' + $runtime + '" %LIBDIR%64\'
              'IF ERRORLEVEL 1 EXIT /B 1'
            } else { $line }
          }
          if (($fixed -join "`n") -notmatch [regex]::Escape($runtime)) { throw 'Unexpected update_mingwlib.bat format' }
          $fixed | Set-Content update_mingwlib.bat -Encoding ASCII
          Get-Content update_mingwlib.bat
      - name: Update version
        shell: cmd
        run: call update_version.bat
      - name: Fix Windows API target for Windows 10
        shell: pwsh
        run: |
          $files = @(git ls-files -- '*.props' '*.vcxproj' '*.targets' '*.h' '*.cpp')
          $count = 0
          foreach ($file in $files) {
            if ($file -match '^src/thirdparty/') { continue }
            $path = Join-Path $PWD $file
            if (!(Test-Path -LiteralPath $path -PathType Leaf)) { continue }
            $old = [IO.File]::ReadAllText($path)
            $new = $old -creplace '\b(WINVER|_WIN32_WINNT)(\s*=\s*|[ \t]+)0x06010000\b', '${1}${2}0x0A00'
            if ($new -cne $old) {
              [IO.File]::WriteAllText($path, $new, [Text.UTF8Encoding]::new($true))
              Write-Host "Updated Windows API target: $file"
              $count++
            }
          }
          if ($count -eq 0) { throw 'Windows API macro definitions not found; inspect project properties before building.' }
          git diff --stat
      - name: Build MPC-HC x64
        shell: cmd
        run: msbuild mpc-hc.sln /m /t:Build /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0
      - name: Upload MPC-HC
        uses: actions/upload-artifact@v4
        with:
          name: MPC-HC-2.5.2-x64-${{ inputs.source }}
          path: bin/mpc-hc_x64/**
          if-no-files-found: error
