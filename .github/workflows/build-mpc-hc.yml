name: Build MPC-HC x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout MPC-HC 2.5.2
        uses: actions/checkout@v4
        with:
          ref: '472f8fbc8'
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install assembler tools
        run: choco install nasm yasm -y

      - name: Check build environment
        shell: pwsh
        run: |
          msbuild -version
          git --version
          git log -1 --oneline

      - name: Update version
        shell: cmd
        run: call update_version.bat

      - name: Build MPC-HC x64
        shell: cmd
        run: |
          msbuild mpc-hc.sln /m /t:Build /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0

      - name: Upload MPC-HC
        uses: actions/upload-artifact@v4
        with:
          name: MPC-HC-2.5.2-x64
          path: bin/mpc-hc_x64/
          if-no-files-found: error
          retention-days: 30
