name: Check MPC-HC Compatibility

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Check Windows SDK versions
        shell: pwsh
        run: |
          Write-Host "=== Windows SDK ==="
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" -Directory |
            Select-Object Name

      - name: Check Visual Studio
        shell: pwsh
        run: |
          Write-Host "=== Visual Studio ==="
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -all -products * -format json

      - name: Check MSBuild
        shell: pwsh
        run: |
          msbuild -version

      - name: Check DPI API declarations
        shell: pwsh
        run: |
          $root = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"

          foreach ($sdk in Get-ChildItem $root -Directory) {
            Write-Host "=== SDK $($sdk.Name) ==="

            $header = Join-Path $sdk.FullName "um\winuser.h"

            if (Test-Path $header) {
              Select-String -Path $header `
                -Pattern "GetDpiForWindow|SystemParametersInfoForDpi|GetSystemMetricsForDpi" `
                -Context 5,5
            }
          }
